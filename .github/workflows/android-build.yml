name: Android Build

on:
  push:
    branches: [ main, master, copilot/add-ci-workflow-for-android ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.5-stable
  EXPORT_NAME: VRig

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      
      - name: Download and setup Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q Godot_v4.5-stable_linux.x86_64.zip
          chmod +x Godot_v4.5-stable_linux.x86_64
          mkdir -p ~/.local/bin
          mv Godot_v4.5-stable_linux.x86_64 ~/.local/bin/godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Download Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.5.stable
          unzip -q Godot_v4.5-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.5.stable/
      
      - name: Setup Godot Android configuration
        run: |
          mkdir -p ~/.config/godot
          ANDROID_SDK_ROOT=$(echo $ANDROID_SDK_ROOT)
          JAVA_HOME=$(echo $JAVA_HOME)
          cat > ~/.config/godot/editor_settings-4.5.tres << EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF
          cat ~/.config/godot/editor_settings-4.5.tres
      
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      
      - name: Import project
        run: |
          godot --headless --editor --quit 2>&1 | tee import.log
          if grep -q "SCRIPT ERROR.*Parse Error" import.log; then
            echo "Warning: Script parse errors detected during import"
          fi
      
      - name: Build Android APK
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/${{ env.EXPORT_NAME }}.apk 2>&1 | tee build.log
          
      - name: Check build output
        run: |
          ls -lh build/android/
          if [ -f build/android/${{ env.EXPORT_NAME }}.apk ]; then
            echo "✅ APK built successfully!"
            file build/android/${{ env.EXPORT_NAME }}.apk
          else
            echo "❌ APK build failed!"
            cat build.log
            exit 1
          fi
      
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-Android
          path: build/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 14
