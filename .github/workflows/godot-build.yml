name: Build VRig Godot

on:
  push:
    branches: [ copilot/translate-unity-to-godot ]
  pull_request:
    branches: [ copilot/translate-unity-to-godot ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5-stable

permissions:
  contents: read

jobs:
  export-linux:
    name: Linux Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          if [ -d "/root/.local/share/godot/export_templates/4.5.stable" ]; then
            cp -r /root/.local/share/godot/export_templates/4.5.stable ~/.local/share/godot/export_templates/4.5.stable
          fi
      
      - name: Import project (to generate .godot folder)
        run: |
          godot --headless --editor --quit 2>&1 | tee import.log || true
      
      - name: Build Linux
        run: |
          mkdir -v -p build/linux
          godot --headless --export-release "Linux/X11" build/linux/VRig.x86_64 2>&1 | tee build.log
      
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: VRig-Linux
          path: build/linux
          retention-days: 14
  
  export-windows:
    name: Windows Export  
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          if [ -d "/root/.local/share/godot/export_templates/4.5.stable" ]; then
            cp -r /root/.local/share/godot/export_templates/4.5.stable ~/.local/share/godot/export_templates/4.5.stable
          fi
      
      - name: Import project
        run: |
          godot --headless --editor --quit 2>&1 | tee import.log || true
      
      - name: Build Windows
        run: |
          mkdir -v -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/VRig.exe 2>&1 | tee build.log
      
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: VRig-Windows
          path: build/windows
          retention-days: 14
  
  export-macos:
    name: macOS Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          if [ -d "/root/.local/share/godot/export_templates/4.5.stable" ]; then
            cp -r /root/.local/share/godot/export_templates/4.5.stable ~/.local/share/godot/export_templates/4.5.stable
          fi
      
      - name: Import project
        run: |
          godot --headless --editor --quit 2>&1 | tee import.log || true
      
      - name: Build macOS
        run: |
          mkdir -v -p build/macos
          godot --headless --export-release "macOS" build/macos/VRig.zip 2>&1 | tee build.log
      
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: VRig-macOS
          path: build/macos
          retention-days: 14
  
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          if [ -d "/root/.local/share/godot/export_templates/4.5.stable" ]; then
            cp -r /root/.local/share/godot/export_templates/4.5.stable ~/.local/share/godot/export_templates/4.5.stable
          fi
      
      - name: Setup Android SDK configuration
        run: |
          mkdir -p /root/.config/godot
          cat > /root/.config/godot/editor_settings-4.5.tres << 'EOF'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF
      
      - name: Import project
        run: |
          godot --headless --editor --quit 2>&1 | tee import.log
          if grep -q "SCRIPT ERROR.*Parse Error" import.log; then
            echo "Warning: Script parse errors detected during import"
          fi
      
      - name: Build Android
        run: |
          mkdir -v -p build/android
          godot --headless --export-release "Android" build/android/VRig.apk 2>&1 | tee build.log
      
      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: VRig-Android
          path: build/android
          retention-days: 14
